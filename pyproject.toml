[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-fusion-ha"
version = "0.6.0"
description = "Korean weather and air-quality fusion for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.0"
license = "MIT"
dependencies = ["beautifulsoup4>=4.12.2,<5"]

[project.optional-dependencies]
test = [
  "homeassistant>=2026.3.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.setuptools.package-data]
"custom_components.weather_fusion" = [
  "*.json",
  "translations/*.json",
  "brand/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
